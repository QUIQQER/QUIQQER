<div class="qui-project-popup-header box" data-name="header"></div>
<div class="qui-project-popup-body box" data-name="tree"></div>
<div class="qui-project-popup-results" data-name="results" hidden>
    <p class="messages-message message-information" role="status" aria-live="polite" data-name="status"></p>
    <ul data-name="resultList"></ul>
</div>
<div class="qui-project-popup-footer">
    <div class="qui-project-popup-selection" data-name="selection" hidden></div>
    <div class="qui-project-popup-search">
        <input type="search" data-name="search" maxlength="200" autocomplete="off"
               aria-label="{{searchLabel}}" placeholder="{{searchLabel}}">
        <button type="button" class="qui-button" data-name="searchButton" aria-label="{{searchButtonLabel}}" disabled>
            <span class="fa fa-search" aria-hidden="true"></span>
        </button>
    </div>
</div>
