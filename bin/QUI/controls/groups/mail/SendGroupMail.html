<div class="quiqqer-quiqqer-group-mail-group">
    <table class="data-table data-table-flexbox">
        <tbody>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{labelGroupName}}
                    </span>
                    <span class="field-container-field">
                        {{groupName}}
                    </span>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{labelRecipientCount}}
                    </span>
                    <span class="field-container-field">
                        {{recipientCount}}
                    </span>
                </label>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="quiqqer-quiqqer-group-mail-mailEditor">
    <label>
        <span>{{labelMailSubject}}</span>
        <input class="quiqqer-quiqqer-group-mail-mailEditor-subject" type="text"/>
    </label>
    <label>
        <span>{{labelMailContent}}</span>
        <div class="quiqqer-quiqqer-group-mail-mailEditor-content"></div>
    </label>
</div>
