<div class="quiqqer-quiqqer-user-mail-user">
    <table class="data-table data-table-flexbox">
        <tbody>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{labelUserName}}
                    </span>
                    <span class="field-container-field">
                        {{userName}}
                    </span>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{labelUserLang}}
                    </span>
                    <span class="field-container-field">
                        {{userLang}}
                    </span>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{labelUserEmail}}
                    </span>
                    <span class="field-container-field">
                        {{userEmail}}
                    </span>
                </label>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="quiqqer-quiqqer-user-mail-mailEditor">
    <div class="quiqqer-quiqqer-user-mail-mailEditor-fields">
        <label>
            <span>{{labelMailSubject}}</span>
            <input class="quiqqer-quiqqer-user-mail-mailEditor-subject" type="text"/>
        </label>
        <label>
            <span>{{labelMailContent}}</span>
            <div class="quiqqer-quiqqer-user-mail-mailEditor-content"></div>
        </label>
    </div>
    <div class="quiqqer-quiqqer-user-mail-placeholders">
        <span>{{labelPlaceholders}}</span>
        <ul>
            {{#placeholders}}
            <li><code>[{{token}}]</code>: {{label}}</li>
            {{/placeholders}}
        </ul>
        <p class="quiqqer-quiqqer-user-mail-placeholders-hint">
            {{placeholdersHint}}
        </p>
    </div>
</div>
