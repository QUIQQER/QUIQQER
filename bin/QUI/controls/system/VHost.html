<form data-name="form">
    <table class="data-table data-table-flexbox">
        <thead>
        <tr>
            <th>
                {{titleHostData}}
            </th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>
                <label class="field-container" for="{{idPrefix}}-domain">
                    <span class="field-container-item">
                        {{labelDomain}}
                    </span>
                    <input class="field-container-field"
                           id="{{idPrefix}}-domain"
                           data-name="domain"
                           type="text"
                           aria-describedby="{{idPrefix}}-domain-description"
                           disabled
                    />
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <div class="field-container-item-desc" id="{{idPrefix}}-domain-description">
                    {{descriptionDomainVariants}}
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container" for="{{idPrefix}}-project">
                    <span class="field-container-item">
                        {{labelProject}}
                    </span>
                    <select class="field-container-field"
                            id="{{idPrefix}}-project"
                            data-name="project"
                            required
                    ></select>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container" for="{{idPrefix}}-root-language">
                    <span class="field-container-item">
                        {{labelRootLanguage}}
                    </span>
                    <select class="field-container-field"
                            id="{{idPrefix}}-root-language"
                            data-name="root-language"
                            required
                    ></select>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container" for="{{idPrefix}}-template">
                    <span class="field-container-item">
                        {{labelTemplate}}
                    </span>
                    <select class="field-container-field"
                            id="{{idPrefix}}-template"
                            data-name="template"
                    ></select>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container" for="{{idPrefix}}-error">
                    <span class="field-container-item">
                        {{labelErrorSite}}
                    </span>
                    <input class="field-container-field project-site"
                           id="{{idPrefix}}-error"
                           data-name="error"
                    />
                </label>
            </td>
        </tr>
        </tbody>
    </table>

    <table class="data-table data-table-flexbox control-system-vhost-redirects">
        <thead>
        <tr><th>{{titleRedirects}}</th></tr>
        </thead>
        <tbody>
        <tr>
            <td>
                <label class="field-container" for="{{idPrefix}}-www-redirect">
                    <span class="field-container-item">{{labelWwwRedirect}}</span>
                    <select class="field-container-field"
                            id="{{idPrefix}}-www-redirect"
                            data-name="www-redirect"
                            aria-describedby="{{idPrefix}}-www-description"
                    >
                        <option value="">{{optionWwwGlobal}}</option>
                        <option value="www">{{optionWww}}</option>
                        <option value="nonwww">{{optionNonWww}}</option>
                        <option value="none">{{optionWwwNone}}</option>
                    </select>
                </label>
                <div class="field-container-item-desc" id="{{idPrefix}}-www-description">
                    {{descriptionWwwRedirect}}
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container" for="{{idPrefix}}-https-host">
                    <span class="field-container-item">
                        {{labelHttpsHost}}
                    </span>
                    <input class="field-container-field"
                           id="{{idPrefix}}-https-host"
                           data-name="https-host"
                           aria-describedby="{{idPrefix}}-https-description"
                    />
                </label>
                <div class="field-container-item-desc" id="{{idPrefix}}-https-description">
                    {{descriptionHttpsHost}}
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <table class="data-table data-table-flexbox control-system-vhost-path-languages"
           data-name="path-languages-table"
           hidden
    >
        <thead>
        <tr>
            <th>
                {{titlePathLanguages}}
            </th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td class="control-system-vhost-path-languages-description">
                <div class="field-container-item-desc">
                    {{descriptionPathLanguages}}
                </div>
            </td>
        </tr>
        </tbody>
        <tbody data-name="path-languages"></tbody>
    </table>
</form>
