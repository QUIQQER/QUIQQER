<div class="qui-update">
    <div class="qui-update-header">
        <div>
            <img src="{{URL_BIN_DIR}}quiqqer_logo_mini.png" alt="QUIQQER Logo" class="qui-update-logo"/>
            <div class="qui-update-badges">
                <span class="qui-update-badge qui-update-version">
                    {{titleQUIQQER}}: <strong class="qui-update-version-value"></strong>
                </span>
                <span class="qui-update-badge qui-phpversion">
                    {{titlePHP}}: <strong class="qui-phpversion-value"></strong>
                </span>
                <span class="qui-update-badge qui-database">
                    {{titleDatabase}}: <strong class="qui-database-value"></strong>
                </span>
            </div>
        </div>

        <div class="qui-update-meta-tableData">
            <div class="qui-update-meta qui-update-ref-row">
                <span class="qui-update-label">{{titleReference}}</span>
                <span class="qui-update-value qui-update-ref"></span>
            </div>
            <div class="qui-update-meta">
                <span class="qui-update-label">{{titleLastUpdateCheck}}</span>
                <span class="qui-update-value qui-update-lastCheck"></span>
            </div>
            <div class="qui-update-meta">
                <span class="qui-update-label">{{titleLastUpdate}}</span>
                <span class="qui-update-value qui-update-last"></span>
            </div>
        </div>
    </div>

    <div class="qui-update-grid">
        <section class="qui-update-section qui-update-check">
            <header>
                <div>
                    <h2>{{titleAvailableUpdates}}</h2>
                    <p>{{textAvailableUpdates}}</p>
                </div>
                <div class="qui-update-check-actions"></div>
            </header>
            <div class="qui-update-check-summary">{{textNoUpdateCheckLoaded}}</div>
            <div class="qui-control-packages-update-result"></div>
        </section>

        <section class="qui-update-section qui-update-run">
            <header>
                <div>
                    <h2>{{titleSystemUpdate}}</h2>
                    <p>{{textSystemUpdate}}</p>
                </div>
                <div class="qui-update-run-actions"></div>
            </header>
            <div class="qui-update-run-state">
                <div class="qui-update-run-empty">{{textNoUpdatePrepared}}</div>
            </div>
        </section>
    </div>
</div>
